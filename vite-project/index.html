<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Scene</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #container {
        width: 100vw;
        height: 100vh;
      }

      #buttons {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%); 
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 100;
        width: min(420px, calc(100vw - 40px));
      }

      #step-progress {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }

      #step-progress-fill {
        width: 0%;
        height: 100%;
        background: #e5531a;
        transition: width 0.2s ease;
      }

      #step-progress-label {
        font-size: 13px;
        color: #fff;
        opacity: 0.9;
      }

      .button-row {
        display: flex;
        gap: 10px;
        width: 100%;
        justify-content: center;
      }

      #set-selector {
        position: fixed;
        top: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 150;
      }

      #set-selector button {
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        transition: background 0.2s, transform 0.2s;
        min-width: 150px;
        text-align: left;
      }

      #set-selector button.active {
        background: rgba(50, 115, 235, 0.95);
        color: #fff;
        transform: scale(1.02);
      }

      #set-selector button:not(.active):hover {
        background: rgba(255, 255, 255, 1);
      }

      #set-selector button.active:hover {
        background: rgba(50, 115, 235, 0.95);
        color: #fff;
      }

      #set-selector .label {
        color: #fff;
        font-size: 13px;
        opacity: 0.85;
      }

      #instruction-panel {
        position: fixed;
        top: 20px;
        right: 20px;
        width: min(420px, calc(100vw - 40px));
        background: rgba(0, 0, 0, 0.74);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        z-index: 220;
        backdrop-filter: blur(4px);
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.35);
      }

      #instruction-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        cursor: grab;
        touch-action: none;
      }

      #instruction-panel.dragging #instruction-panel-header {
        cursor: grabbing;
      }

      #instruction-panel-title-wrap {
        min-width: 0;
      }

      #instruction-step-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.82);
      }

      #instruction-title {
        margin-top: 2px;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 700;
        color: #fff;
      }

      #instruction-collapse-btn {
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      #instruction-panel-body {
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        padding: 12px 18px 16px;
      }

      #instruction-bullets {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #instruction-bullets li {
        font-size: 14px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.95);
      }

      #instruction-panel.collapsed #instruction-panel-body {
        display: none;
      }

      #buttons button {
        padding: 12px 24px;
        font-size: 14px;
        cursor: pointer;
        background: #3e9420;
        color: #fff;
        border: none;
        border-radius: 8px;
        transition: background 0.2s;
      }

      #buttons button:hover {
        background: #45a825;
      }

      #instructions-overlay {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 300px;
        z-index: 200;
        transition: opacity 0.3s ease;
      }

      #instructions-overlay h2 {
        margin-bottom: 10px;
        font-size: 18px;
        color: #fff;
      }

      #instructions-overlay p {
        font-size: 14px;
        line-height: 1.5;
        color: #ccc;
      }

      #menu-toggle {
        display: none;
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 200;
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.74);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }

      @media (max-width: 768px) {
        #menu-toggle {
          display: flex;
        }

        #set-selector {
          display: none;
          top: 70px;
          left: 12px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
          background: rgba(0, 0, 0, 0.74);
          backdrop-filter: blur(4px);
          border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 12px;
          padding: 8px;
        }

        #set-selector.open {
          display: flex;
        }

        #set-selector button {
          background: rgba(255, 255, 255, 0.12);
          color: #fff;
          min-width: 160px;
        }

        #set-selector button.active {
          background: rgba(50, 115, 235, 0.95);
          color: #fff;
        }

        #set-selector button:not(.active):hover {
          background: rgba(255, 255, 255, 0.22);
        }

        #buttons {
          bottom: 30px;
          gap: 8px;
          flex-wrap: wrap;
          justify-content: center;
          padding: 0 10px;
        }

        #buttons button {
          padding: 16px 20px;
          font-size: 16px;
          min-width: 70px;
        }

        #instructions-overlay {
          top: 10px;
          left: 10px;
          right: 10px;
          max-width: none;
          padding: 16px;
        }

        #instructions-overlay h2 {
          font-size: 20px;
        }

        #instructions-overlay p {
          font-size: 15px;
        }

        #instruction-panel {
          width: min(280px, calc(100vw - 76px));
          top: 16px;
          right: 12px;
          left: auto;
          transform: none;
        }

        #instruction-title {
          font-size: 16px;
        }
      }

      @media (max-width: 480px) {
        #buttons {
          bottom: 20px;
        }

        #buttons button {
          padding: 14px 16px;
          font-size: 14px;
          flex: 1 1 45%;
        }
      }
    </style>
  </head>
  <body>
    <!-- <button onclick="playAction('DoorOpen')">Open Door</button>
    <button onclick="playAction('DoorClose')">Close Door</button> -->
    <div id="container"></div>
    <button id="menu-toggle" aria-label="Open section menu" aria-expanded="false">&#9776;</button>
    <div id="set-selector">
      <button id="setUnpackingBtn" class="active">Unpacking</button>
      <button id="setInstallationBtn">Installation</button>
      <button id="airControlsBtn">Air Controls</button>
      <!-- <div id="activeSetLabel" class="label">Set: Unpacking</div> -->
    </div>
    <section id="instruction-panel" aria-live="polite">
      <div id="instruction-panel-header">
        <div id="instruction-panel-title-wrap">
          <div id="instruction-step-label">Step --</div>
          <h2 id="instruction-title">Unpacking Instructions</h2>
        </div>
        <button id="instruction-collapse-btn" type="button" aria-expanded="true">Collapse</button>
      </div>
      <div id="instruction-panel-body">
        <ul id="instruction-bullets">
          <li>Use Next to begin the selected set.</li>
        </ul>
      </div>
    </section>
    <!-- <div id="instructions-overlay"> -->
      <!-- <h2 id="instruction-heading">Welcome</h2> -->
      <!-- <p id="instruction-text">Click any step button below to see product instructions.</p> -->
    <!-- </div> -->
    <div id="buttons">
      <div id="step-progress">
        <div id="step-progress-fill"></div>
      </div>
      <div id="step-progress-label">0 of 0 steps</div>
      <div class="button-row">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>
    <!-- <script type="module" src="src/stoveInstructions.js"></script> -->
    <script type="module" src="src/stoveInstructions.js"></script>
  </body>
</html>
